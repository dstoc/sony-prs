[package]
name = "prs-reader-web"
version = "0.1.0"
edition = "2021"
description = "PRS-T1 browser reader simulator"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
embedded-graphics = { version = "0.8.2", default-features = false }
notosans = "0.1.0"
prs-sync-bundle = { path = "../../crates/prs-sync-bundle" }
prs-sync-protocol = { path = "../../crates/prs-sync-protocol" }
prs-markdown = { path = "../../crates/prs-markdown" }
serde_json = "1.0.151"
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"
