<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PRS-T1 reader web</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="simulator">
      <h1>PRS-T1 reader</h1>
      <p id="status" role="status">Open a directory or start cloud sync.</p>
      <p id="active-library">Active library: none</p>
      <section class="sync-panel" aria-label="Cloud library sync">
        <div class="sync-actions">
          <button id="authorize-sync" type="button" disabled>Authorize &amp; sync</button>
          <button id="sync-now" type="button" disabled>Sync now</button>
        </div>
        <a id="approval-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
          Open reader approval page
        </a>
        <p id="sync-status" role="status" aria-live="polite">
          Cloud sync runs only after you start it.
        </p>
      </section>
      <section id="reader-stage" class="reader-stage" aria-label="Reader" hidden>
        <div class="reader-frame">
          <canvas
            id="reader-canvas"
            width="600"
            height="800"
            aria-label="PRS-T1 logical 600 by 800 reader surface"
          ></canvas>
        </div>

        <nav class="reader-controls" aria-label="Reader controls">
          <button type="button" data-command="previous" disabled>Previous</button>
          <button type="button" data-command="next" disabled>Next</button>
          <button type="button" data-command="home" disabled>Home</button>
          <button type="button" data-command="back" disabled>Back</button>
          <button type="button" data-command="toggle_orientation" disabled>
            Switch to landscape
          </button>
          <button type="button" data-command="toggle_fullscreen" disabled>
            Reader fullscreen
          </button>
          <button
            id="toggle-browser-fullscreen"
            type="button"
            disabled
            aria-pressed="false"
          >Fullscreen</button>
        </nav>
      </section>

      <div class="directory-picker">
        <button id="choose-directory" type="button" disabled>Open directory</button>
        <span class="privacy-note">Local files stay in your browser.</span>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
