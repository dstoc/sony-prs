name: PRSync Cloudflare production deployment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: prs-cloudflare-production
  cancel-in-progress: false

env:
  WORKER_BUILD_VERSION: "0.8.6"
  WRANGLER_VERSION: "4.135.0"

jobs:
  change-gate:
    name: Check for Cloudflare deploy-relevant changes
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.change-detection.outputs.deploy }}
    steps:
      - name: Check out the tested main commit and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find the previous successful main CI commit
        id: previous-ci
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha=''
          if candidate_shas=$(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .head_sha'
          ); then
            while IFS= read -r candidate; do
              [[ "$candidate" == "$TESTED_SHA" ]] && continue
              if git merge-base --is-ancestor "$candidate" "$TESTED_SHA"; then
                base_sha="$candidate"
                break
              fi
            done < <(printf '%s\n' "$candidate_shas")
          else
            printf '%s\n' 'could not query prior CI runs; the gate will deploy conservatively'
          fi
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          if [[ -n "$base_sha" ]]; then
            printf 'previous_successful_ci_sha=%s\n' "$base_sha"
          else
            printf '%s\n' 'previous_successful_ci_sha=unknown; the gate will deploy conservatively'
          fi

      - name: Detect Cloudflare deploy-relevant changes
        id: change-detection
        env:
          BASE_SHA: ${{ steps.previous-ci.outputs.base_sha }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gate_args=(
            --repo-root "$GITHUB_WORKSPACE"
            --head "$TESTED_SHA"
            --github-output "$GITHUB_OUTPUT"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ -n "$BASE_SHA" ]]; then
            gate_args+=(--base "$BASE_SHA")
          fi
          python3 tools/prs-cloudflare-deploy-gate.py "${gate_args[@]}"

  deploy:
    name: Build and deploy production Worker
    needs: change-gate
    if: >-
      ${{ needs.change-gate.result == 'success' &&
      needs.change-gate.outputs.deploy == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRS_READER_URL: ${{ vars.PRS_READER_URL }}
    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read production build pins
        id: build-pins
        shell: bash
        run: |
          tools/prs-t1-agent-build.sh print-github-actions >> "$GITHUB_OUTPUT"
          printf 'manifest_hash=%s\n' "$(tools/prs-t1-agent-build.sh print-manifest-hash)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "${{ steps.build-pins.outputs.rust_toolchain }}" \
            --profile minimal \
            --target wasm32-unknown-unknown \
            --no-self-update
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" rustc --version
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" cargo --version

      - name: Cache Worker Rust dependencies
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: prs-cloudflare-production
          add-job-id-key: false
          key: >-
            cloudflare-rust-${{ steps.build-pins.outputs.rust_toolchain }}-
            manifests-${{ steps.build-pins.outputs.manifest_hash }}
          cache-targets: true
          cache-all-crates: true
          cache-bin: true

      - name: Install pinned worker-build
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" install worker-build --version "$WORKER_BUILD_VERSION" --locked

      - name: Install pinned Wrangler
        run: npm install --global "wrangler@$WRANGLER_VERSION"

      - name: Build the production Worker
        working-directory: crates/prs-cloudflare
        run: worker-build --release

      - name: Enable sanitized Wrangler debug logging
        if: ${{ runner.debug == '1' }}
        shell: bash
        run: echo 'WRANGLER_LOG=debug' >> "$GITHUB_ENV"

      - name: Upload and promote production version, then verify schema readiness
        env:
          WRANGLER_LOG_SANITIZE: "true"
        run: tools/prs-cloudflare-deploy.sh --production

      - name: Verify deployed Worker health
        run: |
          curl --fail-with-body --silent --show-error --max-time 10 \
            "${PRS_READER_URL%/}/health"
