name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prs-t1-agent release tag to build/upload
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Release Please
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve the release tag
        id: release-tag
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs['crates/prs-t1-agent--release_created'] == 'true' }}
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ steps.release.outputs['crates/prs-t1-agent--tag_name'] }}
        run: |
          set -euo pipefail

          tag="$MANUAL_TAG"
          if [[ -z "$tag" ]]; then
            tag="$RELEASE_TAG"
          fi
          if [[ -z "$tag" ]]; then
            printf '%s\n' 'no prs-t1-agent release tag was provided or created' >&2
            exit 1
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Read production build pins
        id: build-pins
        if: ${{ steps.release-tag.outputs.tag != '' }}
        shell: bash
        run: |
          tools/prs-t1-agent-build.sh print-github-actions >> "$GITHUB_OUTPUT"
          cp tools/prs-t1-agent-build.sh "$RUNNER_TEMP/prs-t1-agent-build.sh"

      - name: Check out the released commit
        if: ${{ steps.release-tag.outputs.tag != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Install the pinned Rust toolchain and target
        if: ${{ steps.release-tag.outputs.tag != '' }}
        run: |
          rustup toolchain install "${{ steps.build-pins.outputs.rust_toolchain }}" \
            --profile minimal \
            --target "${{ steps.build-pins.outputs.target }}" \
            --no-self-update
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" rustc --version
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" cargo --version

      - name: Install pinned Zig
        if: ${{ steps.release-tag.outputs.tag != '' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "${{ steps.build-pins.outputs.zig_version }}"

      - name: Cache ARM Rust dependencies and tooling
        if: ${{ steps.release-tag.outputs.tag != '' }}
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: prs-t1-armv5te
          add-job-id-key: false
          key: >-
            arm-rust-${{ steps.build-pins.outputs.rust_toolchain }}-
            target-${{ steps.build-pins.outputs.target }}-
            zig-${{ steps.build-pins.outputs.zig_version }}-
            cargo-zigbuild-${{ steps.build-pins.outputs.cargo_zigbuild_version }}-
            build-${{ steps.build-pins.outputs.build_config_hash }}-
            manifests-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          cache-targets: true
          cache-all-crates: true
          cache-bin: true

      - name: Install pinned cargo-zigbuild
        if: ${{ steps.release-tag.outputs.tag != '' }}
        run: |
          cargo_zigbuild_bin="${CARGO_HOME:-$HOME/.cargo}/bin/cargo-zigbuild"
          expected_version="cargo-zigbuild ${{ steps.build-pins.outputs.cargo_zigbuild_version }}"
          if [[ ! -x "$cargo_zigbuild_bin" ]] ||
            [[ "$("$cargo_zigbuild_bin" --version 2>/dev/null)" != "$expected_version" ]]; then
            cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" install cargo-zigbuild \
              --version "${{ steps.build-pins.outputs.cargo_zigbuild_version }}" \
              --locked
          fi
          "$cargo_zigbuild_bin" --version
          zig version

      - name: Build and verify the released PRS-T1 binary
        if: ${{ steps.release-tag.outputs.tag != '' }}
        env:
          PRS_T1_AGENT_REPO_ROOT: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/prs-t1-agent-build.sh" build-and-verify

      - name: Upload the device executable to the GitHub Release
        if: ${{ steps.release-tag.outputs.tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ steps.release-tag.outputs.tag }}" \
            dist/prs-t1-agent-armv5te \
            --clobber
