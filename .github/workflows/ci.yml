name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          cache: false
          shellcheck: false
          pyflakes: false

  host:
    name: Host checks
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      WORKER_BUILD_VERSION: "0.8.6"
      WRANGLER_VERSION: "4.131.1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read production build pins
        id: build-pins
        shell: bash
        run: tools/prs-t1-agent-build.sh print-github-actions >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "${{ steps.build-pins.outputs.rust_toolchain }}" \
            --profile minimal \
            --component rustfmt \
            --target wasm32-unknown-unknown \
            --no-self-update
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" rustc --version
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" cargo --version

      - name: Cache host Rust dependencies
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: prs-workspace-host
          add-job-id-key: false
          key: >-
            host-rust-${{ steps.build-pins.outputs.rust_toolchain }}-
            manifests-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          cache-targets: true
          cache-all-crates: true
          cache-bin: true

      - name: Check formatting
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" fmt --all --check

      - name: Check CI workflow regression contract
        run: tools/test-ci-workflow.sh

      - name: Record tested PRSync versions
        run: |
          mkdir -p ci-artifacts
          tools/prsync-version-report.sh ci-artifacts/prsync-versions.txt
          {
            printf '%s\n' '### PRSync versions'
            cat ci-artifacts/prsync-versions.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Release Please workspace configuration
        run: tools/test-release-please-workflow.sh

      - name: Check Cloudflare Worker configuration
        run: tools/test-prs-cloudflare-config.sh

      - name: Check Cloudflare deployment credential boundaries
        run: python3 tools/test-prs-cloudflare-deployment-credentials.py

      - name: Test release-aware schema readiness probe
        run: tools/test-prs-cloudflare-readiness.sh

      - name: Test restricted publishing command contract
        run: python3 tools/test-prs-cloudflare-publishing.py

      - name: Test Cloudflare D1 migrations
        run: python3 tools/test-prs-cloudflare-migrations.py

      - name: Test Cloudflare authorization state machine
        run: python3 tools/test-prs-cloudflare-authorization.py

      - name: Test PRSync protocol serialization
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" test -p prs-sync-protocol --lib

      - name: Test PRSync bundle validation
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" test -p prs-sync-bundle --lib

      - name: Test sender CLI
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" test -p prs-send --test cli

      - name: Install worker-build for local Worker tests
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" install worker-build --version "$WORKER_BUILD_VERSION" --locked

      - name: Install Wrangler for local Worker tests
        run: npm install --global "wrangler@$WRANGLER_VERSION"

      - name: Run local Cloudflare Worker end-to-end test
        run: python3 tools/test-prs-cloudflare-local.py

      - name: Build Cloudflare Worker WebAssembly
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" build -p prs-cloudflare --target wasm32-unknown-unknown --release

      - name: Run workspace tests
        run: cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" test --workspace

      - name: Upload PRSync version report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prsync-versions
          path: ci-artifacts/prsync-versions.txt
          if-no-files-found: error
          retention-days: 7

  prs-t1-cross-build:
    name: PRS-T1 ARMv7 build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read production build pins
        id: build-pins
        shell: bash
        run: tools/prs-t1-agent-build.sh print-github-actions >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain and target
        run: |
          rustup toolchain install "${{ steps.build-pins.outputs.rust_toolchain }}" \
            --profile minimal \
            --target "${{ steps.build-pins.outputs.target }}" \
            --no-self-update
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" rustc --version
          rustup run "${{ steps.build-pins.outputs.rust_toolchain }}" cargo --version

      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "${{ steps.build-pins.outputs.zig_version }}"

      - name: Cache ARM Rust dependencies and tooling
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: prs-t1-armv7
          add-job-id-key: false
          key: >-
            arm-rust-${{ steps.build-pins.outputs.rust_toolchain }}-
            target-${{ steps.build-pins.outputs.target }}-
            zig-${{ steps.build-pins.outputs.zig_version }}-
            cargo-zigbuild-${{ steps.build-pins.outputs.cargo_zigbuild_version }}-
            build-${{ steps.build-pins.outputs.build_config_hash }}-
            manifests-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          cache-targets: true
          cache-all-crates: true
          cache-bin: true

      - name: Install pinned cargo-zigbuild
        run: |
          cargo_zigbuild_bin="${CARGO_HOME:-$HOME/.cargo}/bin/cargo-zigbuild"
          expected_version="cargo-zigbuild ${{ steps.build-pins.outputs.cargo_zigbuild_version }}"
          if [[ ! -x "$cargo_zigbuild_bin" ]] ||
            [[ "$("$cargo_zigbuild_bin" --version 2>/dev/null)" != "$expected_version" ]]; then
            cargo +"${{ steps.build-pins.outputs.rust_toolchain }}" install cargo-zigbuild \
              --version "${{ steps.build-pins.outputs.cargo_zigbuild_version }}" \
              --locked
          fi
          "$cargo_zigbuild_bin" --version
          zig version

      - name: Build and verify the production executable
        run: tools/prs-t1-agent-build.sh build-and-verify
