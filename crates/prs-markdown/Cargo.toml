[package]
name = "prs-markdown"
version = "0.7.0"
edition = "2021"
description = "Hardware-independent Markdown reading primitives for Sony PRS readers"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
comrak = { version = "0.55.0", default-features = false }
embedded-graphics = { version = "0.8.2", default-features = false }
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Syntect's bundled upstream syntax definitions are loaded directly at runtime.
# The pure-Rust regex backend keeps the shared reader buildable for WASM.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
notosans = "0.1.0"
