[package]
name = "prs-t1-agent"
version = "0.9.0"
edition = "2021"
rust-version = "1.98"
description = "Experimental native framebuffer and input runtime for Sony PRS-T1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embedded-graphics = { version = "0.8", default-features = false }
prs-markdown = { path = "../prs-markdown" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
webpki-root-certs = "1.0.9"
