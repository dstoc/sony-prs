[package]
name = "prs-t1-agent"
version = "0.11.1"
edition = "2021"
rust-version = "1.98"
description = "Experimental native framebuffer and input runtime for Sony PRS-T1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embedded-graphics = { version = "0.8", default-features = false }
prs-markdown = { path = "../prs-markdown" }
prs-sync-bundle = { path = "../prs-sync-bundle" }
prs-sync-protocol = { path = "../prs-sync-protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["hickory-dns", "rustls-no-provider"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "time"] }
webpki-root-certs = "1.0.9"

[dev-dependencies]
notosans = "0.1.0"
