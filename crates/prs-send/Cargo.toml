[package]
name = "prs-send"
version = "0.1.0"
edition = "2021"
description = "Trusted PRSync sender CLI"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "prs-send"
path = "src/main.rs"

[dependencies]
prs-sync-bundle = { path = "../prs-sync-bundle" }
prs-sync-protocol = { path = "../prs-sync-protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
