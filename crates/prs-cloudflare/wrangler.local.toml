# Local-only configuration for the end-to-end test harness.
#
# This file enables the local-test owner boundary. It must not be used for a
# production deployment.
name = "prs-reader-local-e2e"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-18"

[triggers]
crons = ["0 * * * *"]

[build]
command = "worker-build --release --features local-test"

[vars]
PRS_ENVIRONMENT = "local"
PRS_APPROVAL_BASE_URL = "http://127.0.0.1"
# This value is only for the local end-to-end test harness. Production uses a
# Wrangler secret with the same binding name.
PRS_CSRF_SECRET = "local-development-csrf-secret-change-me-32-bytes"

[[d1_databases]]
binding = "DB"
database_name = "prs-reader-local-e2e"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUNDLES"
bucket_name = "prs-reader-local-e2e"
