# The production section references existing resources. Resource creation is
# performed only by tools/prs-cloudflare-bootstrap.sh.
name = "prs-reader"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-18"

# Keep the existing hourly schedule in the Worker configuration. Ordinary
# version publishing does not run `wrangler triggers deploy`, so it does not
# add, change, or remove this schedule.
[triggers]
crons = ["0 * * * *"]

[build]
command = "worker-build --release"

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.local]
name = "prs-reader-local"
workers_dev = true

[env.local.vars]
PRS_ENVIRONMENT = "local"
PRS_APPROVAL_BASE_URL = "http://127.0.0.1"
PRS_READER_WEB_ORIGIN = "http://127.0.0.1:8000"

[[env.local.d1_databases]]
binding = "DB"
database_name = "prs-reader-local"
# This ID is only a local configuration identifier. Wrangler's default local
# mode stores the database in .wrangler/state and does not contact Cloudflare.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.local.r2_buckets]]
binding = "BUNDLES"
bucket_name = "prs-reader-local"

[env.production]
name = "prs-reader"
# The production endpoint is prs-reader.dstoc.workers.dev. No route or Custom
# Domain is configured for this Worker.
workers_dev = true

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
PRS_ENVIRONMENT = "production"
PRS_APPROVAL_BASE_URL = "https://prs-reader.dstoc.workers.dev"
PRS_READER_WEB_ORIGIN = "http://127.0.0.1:8000"

[[env.production.d1_databases]]
binding = "DB"
database_name = "prs-reader-db"
# This ID was returned by the production bootstrap.
database_id = "9bd0143c-418e-457e-8a20-1dab76216ec9"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BUNDLES"
bucket_name = "prs-reader-documents"
