[package]
name = "prs-cloudflare"
version = "0.1.0"
edition = "2021"
description = "Cloudflare Worker for the PRSync service"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
prs-sync-bundle = { path = "../prs-sync-bundle" }
prs-sync-protocol = { path = "../prs-sync-protocol" }
sha2 = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
worker = { version = "0.8.6", features = ["d1"] }
worker-macros = "0.8.6"
