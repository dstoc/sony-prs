[package]
name = "prs-cloudflare"
version = "0.1.0"
edition = "2021"
description = "Cloudflare Worker for the PRSync service"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Enables the local-only test principal constructor. Production builds do not
# compile this seam, and the production fetch path never selects it.
local-test = []

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["async-await"] }
prs-sync-bundle = { path = "../prs-sync-bundle" }
prs-sync-protocol = { path = "../prs-sync-protocol" }
sha2 = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
worker = { version = "0.8.6", features = ["d1"] }
worker-macros = "0.8.6"
web-sys = { version = "0.3.105", features = [
    "Crypto",
    "CryptoKey",
    "RsaHashedImportParams",
    "SubtleCrypto",
] }
